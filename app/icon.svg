<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hearthlight">
  <title>Hearthlight</title>
  <!--
    The master mark. Everything else — the .ico, the Android tiles, the iOS
    home-screen icon — is rasterised from this one file by scripts/brand-icons.mjs.
    Edit here, run `npm run brand:icons`, and the whole set moves together.

    Three things it has to survive, which is why it looks the way it does:

    1. **Sixteen pixels.** A browser tab is 16px. Fine detail is not detail
       there, it is noise — so this is one bold dark shape on one bold light
       one, and nothing else. A lantern was drawn first and thrown away for
       exactly this reason: at 16px its frame turned to mush.
    2. **A dark phone.** The tile is gold rather than the app's near-black,
       because a dark icon on a dark wallpaper is a hole. Gold reads on both.
    3. **A circular mask.** Android crops home-screen icons to whatever shape
       the launcher likes, guaranteeing only the middle 80% — a circle of
       radius 204.8 here. The arch's furthest corner sits 189 from the centre,
       so nothing important can be cropped and the same file is safe to
       declare `maskable`.
  -->
  <defs>
    <linearGradient id="hl-tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2dcba" />
      <stop offset="0.55" stop-color="#d69a52" />
      <stop offset="1" stop-color="#bf7530" />
    </linearGradient>
    <!-- Keeps the hearth mouth from reading as a hole punched in the tile. -->
    <radialGradient id="hl-glow" cx="0.5" cy="0.68" r="0.55">
      <stop offset="0" stop-color="#c67f35" stop-opacity="0.55" />
      <stop offset="1" stop-color="#c67f35" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hl-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f0" />
      <stop offset="0.45" stop-color="#f2dcba" />
      <stop offset="1" stop-color="#d69a52" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#hl-tile)" />

  <!-- The hearth mouth. -->
  <path d="M124 392 L124 264 A132 132 0 0 1 388 264 L388 392 Z" fill="#241309" />
  <ellipse cx="256" cy="320" rx="110" ry="120" fill="url(#hl-glow)" />

  <!-- The fire in it, standing on the hearth floor rather than floating. -->
  <g transform="translate(256 297.5) scale(0.53) translate(-256 -240)">
    <path
      d="M256 84 C300 156 356 200 356 276 C356 346 312 396 256 396
         C200 396 156 346 156 276 C156 234 178 202 204 174
         C206 214 224 232 244 228 C224 190 230 132 256 84 Z"
      fill="url(#hl-flame)"
    />
    <path
      d="M256 226 C276 260 302 278 302 310 C302 346 281 370 256 370
         C231 370 210 346 210 310 C210 278 236 260 256 226 Z"
      fill="#fdf8f0"
      opacity="0.9"
    />
  </g>
</svg>
